name: Render R manuscript figures

on:
  workflow_dispatch:
  push:
    paths:
      - 'figures/R/**'
      - 'data/figures/**'
      - 'results/frontier_v1/**'
      - '.github/workflows/render-r-figures.yml'

permissions:
  contents: write

jobs:
  render-figures:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::ggplot2
            any::dplyr
            any::readr
            any::tidyr
            any::patchwork
            any::scales
            any::svglite
            any::jsonlite
          cache-version: 2

      - name: Record R environment
        run: Rscript -e 'sessionInfo()'

      - name: Render eligible manuscript figures
        run: Rscript figures/R/render_all_figures.R

      - name: Verify outputs
        shell: bash
        run: |
          set -euo pipefail
          for stem in \
            Figure2_temperature_Andrade \
            Figure3_free_NCO_coupling \
            Figure4_chemistry_amplification_interaction; do
            for ext in png pdf svg; do
              test -s "figures/final/${stem}.${ext}"
            done
          done

          if [[ -s results/frontier_v1/frontier_table.csv && \
                -s results/frontier_v1/frontier_v1_decision.json && \
                -s results/frontier_v1/manifest.json ]]; then
            for ext in png pdf svg; do
              test -s "figures/final/Figure5_decision_frontier.${ext}"
            done
          else
            echo "FRONTIER V1 gold absent; Figure 5 correctly skipped."
          fi
          ls -lh figures/final

      - name: Upload publication figures
        uses: actions/upload-artifact@v4
        with:
          name: PUR-manuscript-R-render
          path: |
            figures/final/*.png
            figures/final/*.pdf
            figures/final/*.svg
          if-no-files-found: error
          retention-days: 30

      - name: Commit rendered publication figures
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figures/final/*.png figures/final/*.pdf figures/final/*.svg
          if git diff --cached --quiet; then
            echo "Rendered figures are already up to date."
            exit 0
          fi
          git commit -m "Render manuscript R figures [skip ci]"
          git push
