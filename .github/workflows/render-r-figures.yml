name: Render R manuscript figures

on:
  workflow_dispatch:
  push:
    paths:
      - 'figures/R/**'
      - 'data/figures/**'
      - '.github/workflows/render-r-figures.yml'

permissions:
  contents: read

jobs:
  render-figures:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::ggplot2
            any::dplyr
            any::readr
            any::tidyr
            any::patchwork
            any::scales
            any::svglite
          cache-version: 1

      - name: Record R environment
        run: Rscript -e 'sessionInfo()'

      - name: Render Figure 2-4
        run: Rscript figures/R/render_all_figures.R

      - name: Verify outputs
        shell: bash
        run: |
          set -euo pipefail
          for stem in \
            Figure2_temperature_Andrade \
            Figure3_free_NCO_coupling \
            Figure4_chemistry_amplification_interaction; do
            for ext in png pdf svg; do
              test -s "figures/final/${stem}.${ext}"
            done
          done
          ls -lh figures/final

      - name: Upload publication figures
        uses: actions/upload-artifact@v4
        with:
          name: PUR-Figure2-4-R-render
          path: |
            figures/final/*.png
            figures/final/*.pdf
            figures/final/*.svg
          if-no-files-found: error
          retention-days: 30
