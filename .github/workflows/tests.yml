name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[agent,dev]'
      - run: pytest

      # Small fixture smoke: fast development regression without touching the frozen benchmark.
      - name: Offline benchmark smoke on toy fixture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'EOF'
          import sys; sys.path.insert(0, "tests")
          from conftest import make_toy_table
          make_toy_table().to_csv("/tmp/toy.csv", index=False)
          EOF
          python scripts/freeze_frontier_v1.py --candidates /tmp/toy.csv --config tests/fixture_config.json --out /tmp/frontier --allow-partial
          python scripts/build_blind_bundle.py --candidates /tmp/toy.csv --config tests/fixture_config.json --blind-dir /tmp/b/blind --evaluator-dir /tmp/b/evaluator_only --gold-dir /tmp/gold
          python scripts/verify_no_leakage.py --blind-dir /tmp/b/blind --evaluator-dir /tmp/b/evaluator_only --config tests/fixture_config.json
          python scripts/run_agent_once.py --provider mock --condition pur_agent --blind-dir /tmp/b/blind --out /tmp/r/once.json
          python scripts/run_baselines.py --provider mock --runs 1 --blind-dir /tmp/b/blind --results-root /tmp/r
          python scripts/summarize_benchmark.py /tmp/r

      # Full frozen benchmark smoke: reconstruct 928 responses, freeze gold, anonymize, scan for leakage,
      # then make the deterministic mock traverse the same Agent tool chain. This is infrastructure QA,
      # not a manuscript model-performance result.
      - name: Validate frozen PUR-RECOVER blind bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf benchmark/recover_v1 gold/recover_v1 /tmp/full-agent
          python scripts/freeze_frontier_v1.py --out /tmp/full-frontier
          python scripts/build_blind_bundle.py
          python scripts/verify_no_leakage.py
          python scripts/run_agent_once.py --provider mock --condition pur_agent --out /tmp/full-agent/mock.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/full-agent/mock.json').read_text())
          assert r['decision_valid'] is True
          ev=r.get('evaluation') or {}
          assert ev.get('complete_decision_recovery') is True, ev
          print('full frozen blind benchmark: PASS')
          PY

      - name: Frozen legacy analysis still runs (results are not committed back)
        run: python scripts/run_anchor_analysis.py > /dev/null && git checkout -- results/
