name: Render manuscript figures

on:
  pull_request:
    branches: [main]
    paths:
      - "analysis/figures/**"
      - "data/prospective_validation/experimental_viscosity_v1.csv"
      - ".github/workflows/render_manuscript_figures.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::ggplot2
            any::dplyr
            any::tidyr
            any::patchwork
            any::scales

      - name: Render Figure 2
        run: Rscript analysis/figures/figure2_state_structure.R

      - name: Render Figure 3
        run: Rscript analysis/figures/figure3_one_point_calibration.R

      - name: List outputs
        run: find figures/generated -maxdepth 1 -type f -print

      - name: Upload rendered figures
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-figures-2-3
          path: figures/generated/
          if-no-files-found: error
