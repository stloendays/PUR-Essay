name: Render manuscript figures in R

on:
  push:
    branches:
      - experimental-first-validation-20260917
    paths:
      - "analysis/plot_style.R"
      - "analysis/figure2_state_structure.R"
      - "analysis/figure3_one_point_calibration.R"
      - "data/prospective_validation/experimental_viscosity_v1.csv"
      - ".github/workflows/render-manuscript-figures-r.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::ggplot2
            any::patchwork
            any::dplyr
            any::tidyr
            any::scales
            any::svglite

      - name: Render Figure 2
        run: Rscript analysis/figure2_state_structure.R

      - name: Render Figure 3
        run: Rscript analysis/figure3_one_point_calibration.R

      - name: Upload rendered figures
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-r-figures
          path: figures/r_manuscript
          if-no-files-found: error

      - name: Commit rendered figures
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figures/r_manuscript
          if git diff --cached --quiet; then
            echo "No rendered figure changes."
          else
            git commit -m "figures: render manuscript panels with R"
            git push
          fi
