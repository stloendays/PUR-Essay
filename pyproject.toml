[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pur-essay"
version = "3.0.0"
description = "Source-grounded PUR rheology, deterministic decision frontier (PUR-FRONTIER V1) and blinded scientific-Agent recovery benchmark (PUR-RECOVER V1)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
]

[project.optional-dependencies]
agent = ["openai>=1.60"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
